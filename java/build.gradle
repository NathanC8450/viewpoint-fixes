// Builds the Java part of Viewpoint Fixes (a ZombieBuddy mod).
//
//   ./gradlew build     compile and package build/libs/ViewpointFixes.jar
//   ./gradlew deploy    build, then copy the jar into the mod folder (Contents/mods/ViewpointFixes/42/media/java/client)
//
// Only ZombieBuddy.jar is needed to compile: game and Viewpoint classes are reached by reflection, so the build
// needs neither projectzomboid.jar (class version 69) nor Viewpoint.jar. Point at your copy of ZombieBuddy.jar with
// -PzombieBuddyJar=<path>, or put zombieBuddyJar=<path> in ~/.gradle/gradle.properties.
plugins {
    id 'java'
}

def zombieBuddyJar = findProperty('zombieBuddyJar') ?:
        'C:/SteamLibrary/steamapps/workshop/content/108600/3619862853/mods/ZombieBuddy/libs/ZombieBuddy.jar'

dependencies {
    compileOnly files(zombieBuddyJar)
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17 // the same level as ZombieBuddy and Viewpoint
    options.compilerArgs << '-Xlint:all'
    options.encoding = 'UTF-8'
}

jar {
    archiveFileName = 'ViewpointFixes.jar' // the name mod.info's javaJarFile expects
}

tasks.register('deploy', Copy) {
    group = 'build'
    description = 'Copies the built jar into the mod folder. Close the game first: it holds the jar open.'
    dependsOn jar
    from jar.archiveFile
    into layout.projectDirectory.dir('../Contents/mods/ViewpointFixes/42/media/java/client')
}
